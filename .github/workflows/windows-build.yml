name: Windows build (unsigned, fork)

# Builds an unsigned NSIS installer from the selected ref and uploads it as a workflow artifact.
# It publishes nothing and needs no secrets. The updater is disabled in this build through
# src-tauri/tauri.fork.conf.json, so the installed app never replaces itself with an upstream release.
#
# Fork only: do not include this file or tauri.fork.conf.json in a pull request to
# tover0314-w/opentypeless.
#
# Run it from Actions > "Windows build (unsigned, fork)" > Run workflow (the button appears once this
# file is on the default branch), or push a tag named fork-build-* to build the tagged commit.

on:
  workflow_dispatch:
  push:
    tags: ['fork-build-*']

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri -> target

      - name: Verify bundled Opus build tool
        run: cmake --version

      - name: Build NSIS installer (unsigned, updater disabled)
        run: npx tauri build --ci --bundles nsis --config src-tauri/tauri.fork.conf.json

      - name: Name and hash the installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter '*.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          New-Item -ItemType Directory -Path dist-installer | Out-Null
          $name = "OpenTypeless_${version}-openrouter_x64-setup.exe"
          Copy-Item $installers[0].FullName "dist-installer/$name"
          $hash = (Get-FileHash "dist-installer/$name" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "dist-installer/$name").Length
          @(
            '### Windows installer (unsigned)'
            ''
            "- File: ``$name``"
            "- Size: $size bytes"
            "- SHA-256: ``$hash``"
            "- Source: ``$env:GITHUB_SHA``"
            '- Updater: disabled in this build'
            '- Signing: none. Windows SmartScreen will warn on first run.'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: opentypeless-windows-installer
          path: dist-installer/*.exe
          if-no-files-found: error
          retention-days: 30
